<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador 3D em AR</title>
  
  <!-- Script oficial do Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>

  <!-- Componente 3D / AR -->
  <model-viewer 
    src="seu-objeto.glb" 
    ios-src="seu-objeto.usdz"
    alt="Objeto 3D interativo" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate
    shadow-intensity="1">
    
    <!-- Botão customizado para ativar a AR (opcional) -->
    <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer;">
      Ver no seu espaço (AR)
    </button>
  </model-viewer>

</body>
</html>
