<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador AR</title>
  
  <!-- Script oficial do Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    /* Força o botão de AR a aparecer sempre na tela */
    #custom-ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 999;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="seu-objeto.glb" 
    alt="Objeto 3D em AR" 
    ar 
    camera-controls 
    auto-rotate>
    
    <!-- Botão customizado que chama a função nativa de AR do componente -->
    <button slot="ar-button" id="custom-ar-button">
      📦 Ver em Realidade Aumentada
    </button>
    
  </model-viewer>

</body>
</html>
