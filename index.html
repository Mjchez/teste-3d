<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador AR</title>
  
  <!-- Script oficial do Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    /* Estilo do botão fixo no topo */
    #top-ar-btn {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Botão fixo no topo da tela -->
  <button id="top-ar-btn" onclick="ativarAR()">Ver em Realidade Aumentada</button>

  <model-viewer 
    id="modelo3d"
    src="red_apple.glb"
    alt="Objeto 3D em AR" 
    ar 
    camera-controls 
    auto-rotate>
  </model-viewer>

  <script>
    // Função para forçar a abertura do modo AR ao clicar no botão fixo
    function ativarAR() {
      const modelViewer = document.querySelector('#modelo3d');
      if (modelViewer) {
        modelViewer.activateAR();
      }
    }
  </script>

</body>
</html>
