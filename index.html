<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador 3D em AR</title>
  
  <!-- Script oficial do Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>

  <!-- Componente 3D / AR -->
  <model-viewer 
  src="seu-objeto.glb" 
  ios-src="seu-objeto.usdz"
  alt="Objeto 3D em AR" 
  ar 
  ar-modes="webxr scene-viewer quick-look" 
  camera-controls 
  auto-rotate
  reveal="auto">
  
  <!-- Força um botão fixo na tela que não some -->
  <button slot="ar-button" style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); padding: 14px 28px; background-color: #28a745; color: white; border: none; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100;">
    📦 Ver em Realidade Aumentada
  </button>
</model-viewer>

</body>
</html>
