<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador AR</title>
  
  <!-- Script oficial do Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    #top-ar-btn {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <button id="top-ar-btn" onclick="forcarAR()">📦 Ver em Realidade Aumentada</button>

  <model-viewer 
    id="modelo3d"
    src="seu-objeto.glb" 
    alt="Objeto 3D em AR" 
    ar 
    ar-modes="scene-viewer webxr quick-look" 
    camera-controls 
    auto-rotate>
  </model-viewer>

  <script>
    function forcarAR() {
      const modelViewer = document.querySelector('#modelo3d');
      
      // Tenta acionar a função padrão do Model Viewer primeiro
      if (modelViewer && modelViewer.canActivateAR) {
        modelViewer.activateAR();
      } else {
        // Fallback direto via Intent do Google Scene Viewer para Android (Xiaomi)
        const glbUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/seu-objeto.glb';
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbUrl)}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
        
        window.location.href = intentUrl;
      }
    }
  </script>

</body>
</html>
